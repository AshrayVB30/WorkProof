version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: workproof_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  app:
    build: .
    container_name: workproof_app
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    # Use host network for GUI access or keep as is for headless testing
    # network_mode: host 

volumes:
  mongodb_data:
